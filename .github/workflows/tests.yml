name: Tests

on:
  push:
    # Filtered, not unfiltered — an unfiltered push trigger plus
    # pull_request runs CI twice on every PR commit.
    # Both names: the fleet is split between `main` and `master`, and a
    # single-name filter turns a default-branch rename into a silently dead
    # push trigger. Same hedge dependabot-automerge.yml already carries.
    branches: [main, master]
  pull_request:
  schedule:
    # Daily, off the :00/:30 marks to avoid GitHub's peak-load minutes.
    # Catches drift that no push/PR would surface — a new Postgres/Python
    # point release, a transitive dependency bump, kartikeya's own updates —
    # since this repo can otherwise go quiet for a while between changes.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: pip install ruff==0.15.0 bandit

      - name: Ruff (enforced)
        run: ruff check src tests

      # #290: the step name used to carry a fixed B608 count ("26") that drifted
      # to 48, then 60, silently, because nothing joined the number in this
      # name to bandit's actual output. Every B608 finding has since been
      # triaged (identifier-only interpolation from constants/confirmed
      # schema mappings/DB introspection, values always bound — see the
      # `# nosec B608` reason on each line) and the 2 HIGH B324 weak-hash
      # findings were fixed with usedforsecurity=False. #318 closed the rest:
      # every B310 (urllib scheme audit) either got a scoped `# nosec B310 -`
      # reason (hardcoded https constants, or a path that can't repoint a
      # fixed host) or a real urlparse().scheme allow-list check ahead of the
      # open where the host was config-supplied; the B108 hardcoded-/tmp
      # finding was fixed with tempfile.gettempdir(). No count is repeated in
      # this name — a stale count is worse than none — and `|| true` is gone:
      # bandit now gates like every other lint step.
      #
      # nest/embed.py and nest/llm.py are excluded here, not nosec'd in place:
      # both are vendored byte-for-byte from safe-app-store's libs/nest-pipeline
      # under a CI hash pin (tests/test_nest_pipeline_vendor.py) — "the copy is
      # NOT a place to edit", inline nosec included, since the pin hashes the
      # whole module body. Their two B310 sites (OLLAMA_HOST-derived urlopen
      # calls) are the same ones tests/test_consent_toggles.py already documents
      # as deliberately policy-free: the gate lives at willow-mcp's own tool
      # boundary (model_egress.denial(), consulted by nest_scan et al before the
      # vendored pipeline ever runs), not inside the shared library.
      - name: Bandit
        run: bandit -r src -ll -f txt -x src/willow_mcp/nest/embed.py,src/willow_mcp/nest/llm.py 2>&1 | tee bandit-report.txt

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: ignore

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Derived from pyproject.toml's classifiers, not chosen. willow-mcp
        # advertises 3.11, 3.12 and 3.13 on PyPI; CI ran 3.11 and 3.12, so the
        # ceiling was a support claim nothing had executed.
        #
        # Pull requests run floor and ceiling; push, schedule and dispatch run
        # the full declared range. Safe only because the required check is the
        # aggregate `test` job below, never a matrix cell.
        python-version: ${{ fromJSON(github.event_name == 'pull_request'
          && '["3.11","3.13"]'
          || '["3.11","3.12","3.13"]') }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Path guard
        run: bash scripts/path_guard.sh

      - name: mai-lint (@markdownai docs)
        # #158: deterministic guard against the #156/#157 regression classes
        # (colon-form constraints, structural swallow, frontmatter
        # @phase/@macro). No args → lints the default mai targets
        # (docs/templates/, src/willow_mcp/bundle/templates/, skills/); it
        # auto-detects @markdownai docs, so non-mai markdown — including the
        # HELD Constitution/canon files, which are never mai-converted — is
        # untouched. Scoped to mai_lint only: wiring the rest of tools/ into
        # CI is deferred until the wtool keep-vs-retire call (handoff Q10).
        run: |
          pip install -q pyyaml jsonschema
          python tools/mai_lint.py

      - name: Install dependencies
        run: |
          # kartikeya comes from PyPI via `pip install -e "."`, at the version
          # this repo's pin actually resolves. It used to be installed from git
          # master here, with the note "PyPI kartikeya lags merged master
          # (allow_db, cgroup caps) — drop once 0.0.7 ships". 0.0.7, 0.0.8 and
          # 0.0.9 have all shipped, and the published 0.0.9 carries both
          # features. Leaving it meant CI tested a version no user could get,
          # so the pin was never exercised by anything.
          # Test deps come from the `test` extra in pyproject.toml, not an
          # imperative list here: pytest/pytest-timeout/coverage and pyyaml all
          # live in ONE declared place a developer reproduces with
          # `pip install -e ".[test]"`. pyyaml matters beyond mai_lint —
          # tests/test_release_wiring.py importorskips on it, so leaving it out
          # would turn the release-wiring checks into a silent skip, which is
          # the failure mode those checks exist to catch. Declaring it in the
          # extra keeps it installed on every run without a second copy to drift.
          # jeles is a declared runtime dependency now (it backs
          # willow_institutional_search), so `pip install -e "."` brings it. It
          # stays named here anyway: two test files `importorskip` on it, and if
          # it ever moved back to an extra those checks would skip green rather
          # than fail — which is the silence they were written to end.
          # `jeles` with no version: `pip install -e "."` applies the floor and
          # cap from pyproject.toml, and a range restated here is a second copy
          # that goes stale silently. It did — this line still said `>=0.5.0`
          # after the real floor moved to 0.5.1 for the egress-guard fix.
          pip install -e ".[test]" jeles

      - name: Run tests (under coverage)
        # --timeout-method=thread: dumps every thread's stack and exits even
        # when the main thread is blocked in C (libpq), where the default
        # signal method never fires. Ported from willow-2.0's hang forensics.
        run: |
          coverage run --include='src/willow_mcp/*' -m pytest tests/ -q --timeout=120 --timeout-method=thread
          # Floor, not target: measured 75.1% on master. Ratchet up, never down.
          coverage report --fail-under=70
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          # willow-2.0's recurring ~59% hang: a SELECT blocked on a Postgres
          # lock sits in libpq's C poll loop, uninterruptible by signal-based
          # timeouts — the job eats its full timeout-minutes with no
          # traceback. Server-side timeouts name the error fast instead.
          PGOPTIONS: >-
            -c statement_timeout=90s
            -c lock_timeout=60s
            -c idle_in_transaction_session_timeout=120s

      - name: CLI smoke test — gates / tree / permissions
        # Exercises the actual `willow-mcp` console-script entry point end to
        # end (not just the underlying functions the unit tests already
        # cover), so a broken packaging/entry-point/argparse wiring would
        # fail here even if every unit test still passes.
        run: |
          set -euo pipefail
          export WILLOW_HOME="${RUNNER_TEMP}/willow_home"
          mkdir -p "${WILLOW_HOME}/mcp_apps/smoketest"
          echo '{"permissions": ["full_access"]}' > "${WILLOW_HOME}/mcp_apps/smoketest/manifest.json"

          willow-mcp gates smoketest --json > "${RUNNER_TEMP}/gates.json"
          python -c "import json; json.load(open('${RUNNER_TEMP}/gates.json'))"
          willow-mcp gates --html "${RUNNER_TEMP}/gates.html"
          test -s "${RUNNER_TEMP}/gates.html"

          willow-mcp allow-permission smoketest store_read
          grep -q store_read "${WILLOW_HOME}/mcp_apps/smoketest/manifest.json"
          willow-mcp deny-permission smoketest store_read

          willow-mcp grant-net smoketest --ttl 5m --reason "CI smoke test"
          # Captured via command substitution, not a live pipe: net-status
          # prints several lines, and piping straight into `grep -q` races
          # grep's early exit against the still-writing process.
          NET_STATUS="$(willow-mcp net-status smoketest)"
          echo "${NET_STATUS}" | grep -q active
          willow-mcp revoke-net smoketest

          willow-mcp tree smoketest --json > "${RUNNER_TEMP}/tree.json"
          python -c "import json; d=json.load(open('${RUNNER_TEMP}/tree.json')); assert set(d) >= {'trunk','sap','canopy','roots','rings','leaves','litter','stomata'}, d.keys()"

          # Subject-consent read path (grant/revoke need an operator tty, so only
          # the read-only status is smokeable here). Captured, not piped.
          CONSENT_STATUS="$(willow-mcp consent-status ci-smoke-subject)"
          echo "${CONSENT_STATUS}" | python -c "import json,sys; d=json.load(sys.stdin); assert d['granted_scopes']==[] and d['subject_id']=='ci-smoke-subject', d"
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: CLI smoke test — live gates --serve dashboard
        # willow-mcp gates --serve starts a real local HTTP server with
        # working buttons (not a snapshot) — start it, hit its actual HTTP
        # API the same way the page's own JS does, confirm a button click
        # equivalent (POST /api/action) really flips the manifest on disk,
        # then tear it down. Catches regressions in gates_serve.py/
        # gates_actions.py that unit tests (which call Python functions
        # directly, no HTTP) wouldn't see — a broken route, a serialization
        # bug, uvicorn/Starlette wiring.
        run: |
          set -euo pipefail
          export WILLOW_HOME="${RUNNER_TEMP}/willow_home"
          willow-mcp gates smoketest --serve --port 8788 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8788/api/state > /dev/null && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:8788/ | grep -q 'const APP_ID = "smoketest";'
          curl -sf -X POST http://127.0.0.1:8788/api/action \
            -H "Content-Type: application/json" \
            -d '{"row_id":"perm.smoketest.store_read","inputs":{}}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d"
          grep -q store_read "${WILLOW_HOME}/mcp_apps/smoketest/manifest.json"
          kill "${SERVER_PID}"
          trap - EXIT
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

  vendor-sync:
    # Cross-repo drift-guard for the vendored copies (box audit theme ①). The
    # in-repo hash pins (tests/test_stance_friction.py, tests/test_subject_consent.py)
    # catch LOCAL edits; this job catches the OTHER direction — an upstream
    # advancing while the vendored copy stays behind (exactly how the
    # stance_friction block went missing). Deliberately NOT in `test`'s needs,
    # so it never blocks a merge on its own: if an upstream isn't reachable
    # (private, no token) that check soft-skips with a warning.
    #
    # On drift it does NOT just report "the bytes differ" — that sentence is
    # true of two opposite situations, and reporting both identically cost a
    # diagnosis on every paired canonical+vendor change. scripts/vendor_drift.py
    # classifies against upstream history and open upstream PR heads:
    #   behind   → error. Upstream advanced, the copy stood still.
    #   ahead    → warning. The canonical half is an OPEN upstream PR, so this
    #              is a merge ORDER; merge upstream, re-run, green untouched.
    #   diverged → error. Matches no upstream version and no open PR, i.e. a
    #              hand-edit of the vendored copy. Never forgiven.
    # Only a positive match against a real PR head is downgraded, so the guard
    # is narrowed to the truth rather than weakened.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fetch willow-gate upstream (soft — needs read access)
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: willow-memory/willow-gate
          ref: main
          path: .willow-gate-upstream
          # Fine-grained PAT with read on willow-gate if it's private; falls
          # back to the job token (works when the repo is public / same
          # installation). Set FLEET_RO_TOKEN to enforce against a private upstream.
          token: ${{ secrets.FLEET_RO_TOKEN || github.token }}

      - name: Fetch safe-app-store upstream (soft — needs read access)
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: rudi193-cmd/safe-app-store
          path: .safe-app-store-upstream
          # subject_consent (box audit A1) is vendored FROM safe-app-store's
          # canonical libs/subject-consent. Same soft-fetch posture as willow-gate.
          token: ${{ secrets.FLEET_RO_TOKEN || github.token }}

      - name: Fetch willow upstream (soft — needs read access)
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: willow-memory/Willow
          path: .willow-upstream
          # mem_ratify (box audit B8) is vendored FROM the willow repo's canonical
          # mem_ratify package. Same soft-fetch posture as the others.
          token: ${{ secrets.FLEET_RO_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The friction scorer's body lives in forge-play now (src/willow_mcp/
      # friction_floor.py re-exports it), so the guard compares the INSTALLED
      # forge.friction_floor against willow-gate. Install this package (which
      # pins forge-play) so the comparison is against what a user actually gets.
      - name: Install this package (brings the pinned forge-play)
        run: pip install -e .

      - name: Compare the friction scorer (forge-play's copy) against willow-gate upstream
        run: python scripts/check_vendor_sync.py .willow-gate-upstream/src/willow_gate/friction_floor.py

      - name: Compare vendored subject_consent against upstream (A1)
        run: python scripts/check_subject_consent_sync.py .safe-app-store-upstream/libs/subject-consent/src/subject_consent

      - name: Compare vendored mem_ratify against upstream (B8)
        run: python scripts/check_mem_ratify_sync.py .willow-upstream/mem_ratify

      - name: Compare vendored Nest pipeline against upstream (A4)
        run: python scripts/check_nest_pipeline_sync.py .safe-app-store-upstream/libs/nest-pipeline/src/nest_pipeline

  fleet-seams:
    # The joins between this package and its two siblings — jeles (a declared
    # runtime dependency) and nestor (which mirrors its ledger into FRANK).
    #
    # `test-matrix` already runs tests/test_fleet_wiring.py, which asserts this
    # side of each seam: the grant exists, the DDL ships, the scripts are
    # executable. That is the half that can run with neither sibling installed,
    # and it is not the same claim. Three of these seams were broken while both
    # halves read as fine — each package's own code was correct and nothing
    # exercised the join. So this job stands the fleet up for real and writes
    # data through the real path: the manifest ACL, the shared SQLite file, the
    # hash chain.
    #
    # Deliberately NOT in `test`'s needs, for the same reason vendor-sync isn't:
    # the sibling checkouts may be unreachable (private, no token), and a job
    # that soft-skips must never gate a merge. The soft part is the *checkout*
    # only — once both siblings are on disk, a broken seam fails hard.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 brings the tags, and the tags are load-bearing here
          # rather than cosmetic: this package and jeles both take their version
          # from git via hatch-vcs, so a shallow clone builds as 0.1.devN, which
          # does not satisfy this package's own `jeles>=0.5.1`. On a shallow
          # checkout the co-install seam fails with what reads as a bad pin.
          fetch-depth: 0

      - name: Fetch jeles (soft — needs read access)
        id: jeles
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: hornbook-knowledge/Jeles
          path: .fleet/Jeles
          fetch-depth: 0
          token: ${{ secrets.FLEET_RO_TOKEN || github.token }}

      - name: Fetch nestor (soft — needs read access)
        id: nestor
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: Die-Namic-Systems/Nestor
          path: .fleet/Nestor
          fetch-depth: 0
          token: ${{ secrets.FLEET_RO_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Report what landed
        # Named, not inferred from a later failure. A sibling that did not
        # check out turns every seam that crosses it into a SKIP, and a run
        # that is all SKIPs must not read as a run that passed.
        run: |
          for repo in Jeles Nestor; do
            if [ -d ".fleet/$repo/.git" ]; then
              echo "$repo: $(git -C ".fleet/$repo" describe --tags --always)"
            else
              echo "::warning::$repo did not check out — seams crossing it will SKIP"
            fi
          done

      - name: Stand the fleet up
        # The script users actually run, not a re-implementation of it — a
        # stand-up guarded by a different code path than the documented one is
        # a stand-up nobody checked. It ends by running scripts/fleet_seams.py
        # and exits non-zero if any seam fails.
        run: bash scripts/fleet-standup.sh
        env:
          JELES_REPO: ${{ github.workspace }}/.fleet/Jeles
          NESTOR_REPO: ${{ github.workspace }}/.fleet/Nestor
          WILLOW_PG_DB: willow
          WILLOW_PG_USER: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: postgres
          PGOPTIONS: >-
            -c statement_timeout=90s
            -c lock_timeout=60s
            -c idle_in_transaction_session_timeout=120s

      - name: No seam may SKIP on a runner that has everything
        # The check the seam script itself cannot make. SKIP is the right answer
        # when a half is genuinely absent — an unreachable seam is a smaller
        # claim than a working one, and reporting the smaller as the larger is
        # how a stand-up certifies a fleet that is half up. But this runner
        # provides Postgres and both checkouts, so here a SKIP is an
        # environment regression, and `quiet reads as fine` is exactly the
        # failure mode the `test` gate below was written to end.
        if: steps.jeles.outcome == 'success' && steps.nestor.outcome == 'success'
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.willow/fleet.env"
          .venv/bin/python scripts/fleet_seams.py --json > fleet-seams.json
          python - <<'PY'
          import json, sys
          seams = json.load(open("fleet-seams.json"))["seams"]
          for s in seams:
              print(f"{s['status']:4}  {s['seam']}  —  {s['detail']}")
          skipped = [s["seam"] for s in seams if s["status"] == "SKIP"]
          if skipped:
              print(f"::error::seam(s) skipped on a fully-provisioned runner: {', '.join(skipped)}")
              sys.exit(1)
          print(f"\n{len(seams)} seams, none skipped")
          PY
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Upload seam report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-seams
          path: fleet-seams.json
          if-no-files-found: ignore

  # Aggregate gate: branch protection requires a check named exactly "test".
  # The matrix legs report as "test-matrix (3.11)" / "test-matrix (3.12)";
  # this job carries the required name.
  #
  # `if: always()` is load-bearing. The comment here used to say a failed or
  # skipped leg "leaves it un-run, keeping the merge blocked" — that is exactly
  # backwards. Un-run means *skipped*, a skipped job reports the "skipped"
  # conclusion, and a required check that never reports a failure does not
  # block anything. The one check branch protection is configured to trust went
  # quiet precisely when a leg failed, and quiet reads as fine.
  #
  # It matters more now than it did: release-please arms auto-merge on the
  # release PR, so this check is what stands between a red build and an
  # unattended PyPI publish.
  #
  # `vendor-sync` stays out of `needs` on purpose — see its own comment; it
  # soft-skips when an upstream is unreachable, so it must not gate a merge.
  test:
    needs: [test-matrix, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every dependency actually succeeded
        # skipped and cancelled count as failures: a leg that did not run has
        # told us nothing, and this gate speaks for all of them.
        if: ${{ contains(needs.*.result, 'failure')
                || contains(needs.*.result, 'cancelled')
                || contains(needs.*.result, 'skipped') }}
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test-matrix=${{ needs.test-matrix.result }}"
          echo "::error::a required job did not succeed — see the results above"
          exit 1

      - run: echo "all matrix legs and lint green"

name: Release Please

# Keeps an open "chore: release X.Y.Z" pull request that accumulates every merge
# to master — bumping the proposed version from conventional-commit prefixes,
# appending the CHANGELOG entry, and bumping .claude-plugin/plugin.json to match
# (see extra-files in release-please-config.json). Nothing publishes while it
# sits there. It arms auto-merge on itself, so when CI goes green it merges, the
# tag is created, and the tag push fires `release.yml`.
#
# Before this, releasing meant tagging by hand and remembering that plugin.json
# carries its own version string — which is how it drifted to 2.0.0 while the
# package was 2.0.1.
#
# WHY THE PAT, in both places below. This is the lesson jeles paid three
# releases to learn, and it fails silently every time:
#
#   1. GitHub suppresses workflow runs for any event generated with
#      GITHUB_TOKEN. Not just `push: tags` — `release: published` too. A
#      workflow waiting on either simply never runs, with no error anywhere.
#      jeles v0.2.0: tagged, released, absent from PyPI.
#   2. Calling release.yml via `workflow_call` does start it, but then PyPI
#      authenticates against `job_workflow_ref` (the callee) while the PEP 740
#      attestation records `workflow_ref` (the caller). The two claims disagree
#      by construction and no publisher row reconciles them. jeles v0.2.1 and
#      v0.3.0: built fine, rejected at upload.
#   3. A PAT is not a bot token, so the tag it pushes triggers workflows
#      normally, and caller and callee are the same file.
#
#   The same applies to arming auto-merge: GitHub attributes an auto-merge to
#   whoever armed it, so armed with GITHUB_TOKEN the release PR would merge and
#   this workflow would never run again to cut the tag.
#
# SETUP — the willow-ci GitHub App (id 4749508) must be installed on this org
# with Contents: read/write and Pull requests: read/write, and the org must
# carry the variable WILLOW_CI_APP_ID and the secret WILLOW_CI_PRIVATE_KEY.
# The mint step below refuses to run without them rather than falling back to
# GITHUB_TOKEN, because that fallback produces a working-looking release PR and
# a publish that never happens.

on:
  push:
    # Both names: the fleet is split between `main` and `master`, and a
    # single-name filter turns a default-branch rename into a silently dead
    # push trigger. Same hedge dependabot-automerge.yml already carries.
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run that may be cutting a release

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Mints a short-lived installation token for the willow-ci GitHub App
      # (org variable WILLOW_CI_APP_ID + org secret WILLOW_CI_PRIVATE_KEY).
      #
      # GitHub suppresses workflow runs for events generated with GITHUB_TOKEN,
      # so a tag cut with it starts no release workflow and nothing reaches
      # PyPI — everything reads as fine. An App installation token is not
      # GITHUB_TOKEN, so its tag triggers workflows normally, exactly as the
      # PAT did. Unlike the PAT it is minted per run and expires in an hour;
      # its sibling ENGINE_PROPAGATION_TOKEN expired on 2026-08-04 and stopped
      # eleven repos receiving engine changes for three and a half weeks with
      # no signal.
      #
      # This step is also the guard: if the App is not installed or the key is
      # wrong it fails here and loudly, rather than degrading to GITHUB_TOKEN.
      - name: Mint a willow-ci installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILLOW_CI_APP_ID }}
          private-key: ${{ secrets.WILLOW_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # The PAT, not the default GITHUB_TOKEN — and this is about the *push*
          # in the changelog step below, not about reading.
          #
          # checkout persists whatever credential it used, and `git push` then
          # uses it. `env: GH_TOKEN` only reaches the `gh` CLI. With the default,
          # the commit was pushed as github-actions[bot], so the release PR's CI
          # run came back `action_required` — created but held awaiting manual
          # approval — and auto-merge sat waiting on a check that would never
          # report. Observed on the 2.2.0 release PR, which needed CI started by
          # hand. release-please's own commit on the same branch was not gated,
          # because it pushes with this token.
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Correct the section release-please just wrote — in CHANGELOG.md and in
      # the release PR's own description, its third copy — before auto-merge
      # is armed below, so both are right when the release ships rather than
      # fixed afterwards.
      #
      # This repo merges with merge commits rather than squashing, and GitHub
      # writes the PR title into the merge commit *body*. release-please parses
      # that body, so one change reaches it twice: once as the real commit, once
      # as the merge commit carrying its title. 2.1.2 listed the same fix twice;
      # 2.1.3 listed the merge commit and dropped `0073767` — a shipped fix, left
      # undocumented, with a synthetic entry standing in for it. #274's PR
      # description carried the same duplicate as its changelog entry, after the
      # changelog had already been fixed by hand — the PR body is the one copy a
      # reviewer actually reads before approving the release, and nothing
      # reconciled it. All of these were corrected by hand, which is what this
      # replaces.
      #
      # No `if:` on a release-please output — whether an open release PR exists is
      # read from GitHub below, which is the thing actually being acted on. One
      # less assumption about an action's output names between the check and the
      # work.
      - name: Rebuild the changelog section from the commits
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r pr branch <<<"$(gh pr list --repo "$REPO" --state open \
                     --json number,headRefName \
                     --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                           | first | "\(.number // "")\t\(.headRefName // "")"')"
          if [ -z "$branch" ]; then
            echo "No open release PR — nothing releasable, nothing to correct."
            exit 0
          fi

          git fetch --tags origin "$branch"
          git checkout "$branch"

          # Exit 2 means the tool found something it does not model — a breaking
          # change, an unreadable range. Warn and carry on rather than fail:
          # failing here fails the job, so the auto-merge arming below never
          # runs and the release simply does not ship. That is worse than the
          # problem being fixed, which only ever produced a wrong *changelog*.
          # A bail leaves release-please's own section in place — the old,
          # survivable failure mode — and the warning says to check it by hand.
          set +e
          python tools/changelog_dedup.py
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "::warning::changelog_dedup could not rebuild this section — "\
                 "release-please's version is shipping as-is. Check it by hand."
            exit 0
          fi
          [ "$status" = "0" ] || exit "$status"

          if git diff --quiet -- CHANGELOG.md; then
            echo "release-please's section already matches the commits."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: rebuild the changelog section from the commits

          release-please parsed the merge commits alongside the commits they
          merge, because this repo does not squash-merge. See
          tools/changelog_dedup.py."
          git push origin "$branch"

          # A third copy of this same section lives in the release PR's own
          # description — release-please writes it once, from its own parse,
          # when it opens or updates the PR. Pushing the corrected
          # CHANGELOG.md above does not touch it. It is the one copy still
          # visible to a reviewer deciding whether to approve the release: on
          # #274 the PR body carried the duplicate (`8a436f0` and `f6d39a3`,
          # same fix) after CHANGELOG.md had already been made correct.
          #
          # No new parsing here — the section is already computed and already
          # pushed. Splice it into the existing PR body in place of
          # release-please's own copy, keeping the ":robot: I have created a
          # release" preamble and the "This PR was generated with..." footer
          # around it exactly as release-please wrote them.
          version=$(python -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")

          section_file=$(mktemp)
          python tools/changelog_dedup.py --print-section "$version" > "$section_file"

          body_file=$(mktemp)
          gh pr view "$pr" --repo "$REPO" --json body --jq .body > "$body_file"

          new_body_file=$(mktemp)
          python - "$body_file" "$section_file" "$new_body_file" <<'PY'
          import re
          import sys

          body_path, section_path, out_path = sys.argv[1:4]
          body = open(body_path).read()
          section = open(section_path).read().rstrip("\n")

          # Same header release-please writes into CHANGELOG.md:
          # "## [2.2.1](https://.../compare/v2.2.0...v2.2.1) (2026-08-04)"
          header_re = re.compile(r"^## \[[^\]]+\]\(https://[^)]+\)[^\n]*$", re.MULTILINE)
          m = header_re.search(body)
          if not m:
              # Not the shape this expects -- leave release-please's body
              # alone rather than guess and corrupt the PR description.
              open(out_path, "w").write(body)
              sys.exit(0)

          tail = body[m.end():]
          footer = re.search(r"\n---\n", tail)
          end = m.end() + footer.start() if footer else len(body)

          open(out_path, "w").write(body[:m.start()] + section + "\n" + body[end:])
          PY

          if python - "$body_file" "$new_body_file" <<'PY'
          import sys
          a, b = (open(p).read().rstrip() for p in sys.argv[1:3])
          sys.exit(0 if a == b else 1)
          PY
          then
            echo "Release PR description already matches CHANGELOG.md."
          else
            echo "Release PR description disagrees with CHANGELOG.md — updating it."
            gh pr edit "$pr" --repo "$REPO" --body-file "$new_body_file"
          fi

      # The GitHub Release body is generated by release-please from its OWN
      # parse, not from CHANGELOG.md — so correcting the file leaves the release
      # page still wrong. v2.1.4's page carried the duplicate entry after the
      # changelog had been fixed, which is how this was found.
      #
      # This runs after the action, in the run where the release is created, and
      # replaces the body with the (by then corrected) section from CHANGELOG.md.
      # It is the only place the two are made to agree.
      #
      # There is no repository setting that avoids the underlying problem. The
      # merge-commit title/message combinations GitHub accepts are exactly
      # PR_TITLE+PR_BODY, PR_TITLE+BLANK and MERGE_MESSAGE+PR_TITLE; all three
      # put the PR title somewhere release-please parses, and release-please has
      # no option to skip merge commits (its only filter, `exclude-paths`, works
      # on file paths — useless for a merge commit, whose file set is the union
      # of what it merges). This step and the one above are the fix, not a
      # stand-in for one.
      - name: Make the GitHub Release body match the changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The step above may have left the tree on the release PR branch.
          # Read the pushed commit, always.
          git checkout --quiet "$GITHUB_SHA"

          version=$(python -c "import json;print(json.load(open('.release-please-manifest.json'))['.'])")
          tag="v${version}"

          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release $tag yet — nothing to sync (this run did not cut one)."
            exit 0
          fi

          want=$(mktemp)
          if ! python tools/changelog_dedup.py --print-section "$version" > "$want"; then
            echo "::warning::no changelog section for ${version} — leaving the "\
                 "release body as release-please wrote it."
            exit 0
          fi

          have=$(mktemp)
          gh release view "$tag" --repo "$REPO" --json body --jq .body > "$have"

          # Compare on content, not on trailing whitespace. GitHub returns the
          # body without a final newline while the extracted section has one, and
          # a plain `diff` calls that a difference — which would rewrite the
          # release on every push to master forever. Caught by running this
          # against the live v2.1.5 release, where the bodies were identical and
          # the naive comparison still reported a mismatch.
          if python - "$want" "$have" <<'PY'
          import sys
          a, b = (open(p).read().rstrip() for p in sys.argv[1:3])
          sys.exit(0 if a == b else 1)
          PY
          then
            echo "Release $tag already matches CHANGELOG.md."
            exit 0
          fi

          echo "Release $tag disagrees with CHANGELOG.md — updating it."
          diff "$have" "$want" || true
          gh release edit "$tag" --repo "$REPO" --notes-file "$want"

      # Arm auto-merge, so a release ships when CI goes green rather than when
      # someone remembers the PR is open. Re-armed on every push to master,
      # which is also the self-heal: release-please rewrites the PR as commits
      # land, and this puts the arming back either way.
      - name: Arm auto-merge on the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                       | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR — nothing releasable since the last tag."
            exit 0
          fi

          echo "Arming auto-merge on release PR #${pr}"
          if gh pr merge --auto --merge "$pr" --repo "$REPO"; then
            exit 0
          fi

          # Do not fall back to merging directly. `--auto` is what makes the
          # merge wait for CI; merging here instead would publish off an
          # unverified commit, and a PyPI version can never be reused or
          # replaced. Fail loudly and say what to fix.
          cat <<'MSG'
          ::error::Could not arm auto-merge on the release PR.

          Both of these must hold, and GitHub declines quietly otherwise:
            1. Settings -> General -> "Allow auto-merge" is enabled.
            2. master's branch protection requires at least one status check
               (this repo's is the aggregate `test` job). With no required
               check there is nothing for auto-merge to wait on, so GitHub
               will not arm it at all.

          Releases still work — the PR is there to merge by hand.
          MSG
          exit 1

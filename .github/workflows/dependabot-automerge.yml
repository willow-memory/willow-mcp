name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, main]

# GITHUB_TOKEN keeps only what the read-only metadata fetch below needs.
# Everything that arms auto-merge uses a willow-ci App token instead (see WHY
# A NON-BOT CREDENTIAL below), so GITHUB_TOKEN performs no write in this workflow and does
# not need write scope.
permissions:
  contents: read
  pull-requests: read

# Deliberately NO `gh pr update-branch` anywhere in this workflow: pushes made
# with GITHUB_TOKEN do not trigger workflow runs, so a token-made update
# strands the PR on a head commit that CI will never report on — auto-merge
# then waits forever. Arming auto-merge is sufficient: when branch protection
# has "require branches to be up to date", GitHub updates the branch
# server-side, and THAT update runs CI normally.
#
# WHY A NON-BOT CREDENTIAL (#297). Arming was correct; the token behind it was not.
# GitHub attributes the merge auto-merge eventually performs to whoever armed
# it — release-please.yml documents the same fact for the release PR. `gh pr
# merge --auto` run with GITHUB_TOKEN here armed the merge as github-actions[bot],
# so when checks passed and GitHub merged #293 for real, the resulting push to
# master was a GITHUB_TOKEN push: no `Tests` run, no `Release Please` run, zero
# workflow runs against `3c848a1` at all. That silently dropped two CHANGELOG
# entries (release-please's changelog-rebuild step never ran) and left master
# red with nobody told. Arming with the willow-ci App token — the same
# credential release-please.yml uses, not a new one — makes the
# eventual merge a normal, non-bot push, so `Tests` (on: push) and
# `Release Please` (on: push) both run on the result like any other merge to
# master. `dependabot/fetch-metadata` above stays on GITHUB_TOKEN: it only
# reads the PR, it merges nothing, and giving it the PAT would be scope it
# never needs.

jobs:
  dependabot-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Mints a willow-ci App installation token. Same credential
      # release-please.yml uses — still "not a new credential", which was the
      # point of #297 — but minted per run and expiring in an hour instead of
      # a PAT on a timer. The property that matters is unchanged: an App
      # installation token is not GITHUB_TOKEN, so the merge it arms is a
      # normal non-bot push and `Tests` / `Release Please` run on the result.
      #
      # This step is also the guard the "Require the release PAT" step used to
      # be: if the App is not installed or the key is wrong it fails here,
      # rather than degrading to GITHUB_TOKEN.
      - name: Mint a willow-ci installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILLOW_CI_APP_ID }}
          private-key: ${{ secrets.WILLOW_CI_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          steps.metadata.outputs.update-type == 'github_actions'
        env:
          # The PAT, not GITHUB_TOKEN — see WHY THE PAT above. This is the
          # token whose identity the eventual auto-merge push carries.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

  refresh-stale-dependabot-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Mints a willow-ci App installation token. Same credential
      # release-please.yml uses — still "not a new credential", which was the
      # point of #297 — but minted per run and expiring in an hour instead of
      # a PAT on a timer. The property that matters is unchanged: an App
      # installation token is not GITHUB_TOKEN, so the merge it arms is a
      # normal non-bot push and `Tests` / `Release Please` run on the result.
      #
      # This step is also the guard the "Require the release PAT" step used to
      # be: if the App is not installed or the key is wrong it fails here,
      # rather than degrading to GITHUB_TOKEN.
      - name: Mint a willow-ci installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILLOW_CI_APP_ID }}
          private-key: ${{ secrets.WILLOW_CI_PRIVATE_KEY }}

      - name: Re-arm auto-merge on open Dependabot PRs after the base moves
        env:
          # The PAT, not GITHUB_TOKEN — see WHY THE PAT above the jobs.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --repo "${{ github.repository }}" --state open --author app/dependabot --json number --jq '.[].number')
          for pr in "${prs[@]}"; do
            echo "Re-arming auto-merge on Dependabot PR #${pr}"
            gh pr merge --auto --merge "$pr" --repo "${{ github.repository }}" || true
          done

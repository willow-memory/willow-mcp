[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "willow-mcp"
# The git tag is the single source of truth — see [tool.hatch.version]. This was
# hardcoded at 2.0.1 while master ran 251 commits past the v2.0.1 tag, and
# .claude-plugin/plugin.json had drifted to a different number again. A number
# nothing checks is a number that goes stale.
dynamic = ["version"]
description = "Agent-neutral MCP server — SQLite store, Postgres knowledge base, Kart task queue"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sean Campbell" }]
requires-python = ">=3.11"
keywords = ["mcp", "knowledge-base", "task-queue", "willow", "oauth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9,<3.0",
    # Spans majors deliberately, unlike every other third-party pin here.
    # cryptography's majors are near-calendar releases that mostly drop old
    # OpenSSL and old Python rather than change the API this repo uses (Fernet,
    # x509, hazmat primitives in signing.py/pgp.py/vault.py). Capping at the
    # next major would mean a release-cadence bump every few months for no
    # observed break. 50 is the next unreleased major at time of writing, i.e.
    # "everything shipped, nothing unseen". docs/design/fleet-versioning.md
    # Rule 1 requires this comment; it named this line as its example of a
    # documented exception while the line had no comment at all.
    "cryptography>=42.0,<51.0",
    "starlette>=1.3.1,<2.0",
    # Pre-1.0 and NOT capped at the next minor, unlike the two fleet packages
    # below. Deliberate, and the exception docs/design/fleet-versioning.md
    # Rule 1 allows for third parties: uvicorn's 0.x minors are not breaking in
    # practice, and we do not control its bump policy either way.
    "uvicorn>=0.29,<1.0",
    # Kart task executor (the `willow-mcp worker` engine + task-queue backends).
    # Hard dependency as of B-22 close-out — kartikeya is published on PyPI, so a
    # base `pip install willow-mcp` now ships a working queue drainer.
    #
    # Floor raised to the published 0.0.9 rather than left two releases stale.
    # The cap stays at the next major. A revision of this file briefly made it
    # `<0.1.0`, on the reasoning that kartikeya ships breaking changes as minors
    # below 1.0 — see docs/design/fleet-versioning.md Rule 1 for why that was
    # withdrawn. Short version: kartikeya's own config says its next `feat:` is
    # 0.1.0, so the tight cap would have expired on the next feature commit.
    #
    # Floor raised again to 0.0.12 for B-65: that release binds WILLOW_ROOT
    # read-only and makes {{WILLOW_ROOT}}/worktrees the writable lane, so a
    # sandboxed task can no longer edit gate.py — the code deciding what tasks
    # may do. This floor is load-bearing rather than housekeeping. 0.0.12 adds
    # `ensure_work_root()`, which CREATES that lane; on an older kartikeya the
    # read-only posture still applies from config, but a missing worktrees/
    # directory is never recreated and every task then fails with what reads
    # like a permissions bug. Same class as B-33's floor, and the same reason it
    # is regression-tested rather than trusted to the pin
    # (tests/test_b65_work_root_sandbox.py).
    "kartikeya>=0.0.12,<1.0.0",
    # Jeles the Librarian — the ~60 named institutional and academic collections
    # behind `willow_institutional_search`. A hard dependency rather than an
    # extra because the tool is registered unconditionally: an optional import
    # would mean a tool that exists in the listing and fails when called, which
    # is worse than either shipping it or not.
    #
    # Cheap to take: jeles declares no runtime dependencies of its own (stdlib
    # only, by design), so this adds one wheel and no tree.
    #
    # Floor is 0.5.1, not 0.5.0: 0.5.0 is where the source-host registry lands
    # (what `willow_institutional_search` needs to work) but 0.5.1 is where
    # jeles' egress guard stops following a redirect to a private address, and
    # closes a percent-encoded-host bypass of that guard — and that tool reaches
    # the network through jeles' guard, not this repo's.
    #
    # That is also why the cap is `<1.0.0` and not `<0.6.0`. This file briefly
    # said `<0.6.0`, reasoning that jeles ships breaking changes as minors below
    # 1.0 so a `<1.0.0` cap promises nothing. True, and the wrong fix: the cap
    # is what carries a jeles security patch to users, and the tool it guards is
    # the one whose SSRF defence lives in jeles. A tight cap would have frozen
    # that defence at 0.5.x until this package cut a release of its own. See
    # docs/design/fleet-versioning.md, Rule 1.
    "jeles>=0.5.1,<1.0.0",
    # The Forge — the engine that refuses a confident wrong answer (checkpoint
    # loop, measuring panel, calibration). The three modules this repo used to
    # OWN and the Forge used to vendor — human_loop, friction_floor, and the
    # detection half of model_egress — now live there, and src/willow_mcp/
    # {human_loop,friction_floor,model_egress}.py are re-export seams so no
    # import path here changes (tests/test_forge_take.py proves they are the
    # same objects). Operator, 2026-09-02: "willow gains the dependency on the
    # engine, but the apps here will only run on it." The Forge never imports
    # willow-mcp; that is the only direction the arrow may point.
    #
    # Cheap to take, same as jeles: forge-play declares no runtime dependencies
    # (its heavy pieces — Nestor, fsrs, kartikeya — are all soft), so this adds
    # one wheel and no tree. Cap at the next major per Rule 1; forge-play sets
    # bump-minor-pre-major false, so a breaking change cuts 1.0.0 and <1.0.0 is
    # a real range.
    "forge-play>=0.1.0,<1.0.0",
    # willow-gate — the check-in/check-out gate this fleet's trust tiers were
    # first written for (trust_scale, custody, message_integrity, and the
    # original friction_floor the Forge later vendored byte-for-byte). Taken
    # the same way forge-play was, on the operator's word 2026-09-03: the
    # dependency lands first, with tests/test_gate_take.py proving the package
    # installs and its names resolve; moving any seam here onto it is its own
    # change, one module at a time, never this commit. willow-gate never
    # imports willow-mcp; that is the only direction the arrow may point.
    #
    # Cheap to take: python-gnupg and cryptography, both already in this tree's
    # environment for the PGP path. Cap at the next major per Rule 1;
    # willow-gate sets bump-minor-pre-major false, so a breaking change cuts
    # 1.0.0 and <1.0.0 is a real range.
    "willow-gate>=0.1.0,<1.0.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
# The Nest content pipeline (willow_mcp.nest) runs on the stdlib for text, code,
# JSON, and --llm (local Ollama over urllib). These unlock extra source types —
# OCR, PDF, and .docx — and the engine degrades gracefully when they are absent,
# so `pip install willow-mcp` stays lean and `pip install willow-mcp[nest]` opts
# in. System packages tesseract-ocr and poppler-utils are installed separately.
nest = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdfplumber>=0.10.0",
    "pdf2image>=1.16.0",
    "python-docx>=1.2.0",
]
web = [
    "requests>=2.31,<3.0",
]
# Nestor verified-match engine backs the natural-language tool oracle
# (willow_mcp.tool_oracle / nestor_tool_route — docs/design/nestor-tool-route.md).
# PyPI package name: nestor-meaning (import name: nestor).
#
# Floor is 0.7.0, not 0.6.0: SqliteStore landed in 0.6.0 but EntityResolver —
# the other import tool_oracle.py needs — landed in 0.7.0. The cap follows
# Rule 1 (docs/design/fleet-versioning.md): nestor sets bump-minor-pre-major
# false, so <1.0.0 is a real compatibility range.
nestor = ["nestor-meaning>=0.7.0,<1.0.0"]
# Sentry telemetry for the Bug Smash observability experiment. Opt-in only:
# inert unless WILLOW_SENTRY_DSN is set at runtime (see observability.py).
observability = ["sentry-sdk>=2.0,<3.0"]
voice = [
    "numpy>=1.26,<3.0",
    "openwakeword>=0.6,<1.0",
    "silero-vad>=5.1,<7.0",
    "faster-whisper>=1.0,<2.0",
    "sounddevice>=0.4,<1.0",
    "torch>=2.2,<3.0",
]
gcal = [
    "google-api-python-client>=2.0,<3.0",
    "google-auth>=2.0,<3.0",
]
# The test bootstrap: `pip install -e ".[test]"` reproduces CI's test job from
# ONE declared place instead of an imperative `pip install` line in tests.yml.
# pyyaml + jsonschema are what makes this a real dependency group and not just
# runner packaging: tools/mai_lint.py imports both at module load, so the
# `test_handoff_write_v4_closeout_is_proper_mai` test (which imports mai_lint)
# and the mai-lint CI step both need them. Left undeclared, a fresh checkout
# ran green in CI — where the workflow pip-installed pyyaml by hand — and failed
# on any developer's machine, which is the exact split this group closes.
# jsonschema was only ever present transitively (via mcp); named here so the
# tool that needs it stops relying on someone else's dependency tree.
# jeles stays named in tests.yml rather than here: it is a runtime dependency
# `pip install -e "."` already brings, and two test files importorskip on it —
# see the comment on that step for why it is restated explicitly.
test = [
    "pytest",
    "pytest-timeout",
    "coverage",
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.0,<5.0",
]

[project.scripts]
willow-mcp = "willow_mcp.server:main"
wmc = "willow_mcp.server:main"
willow-mcp-init = "willow_mcp.home_init:main"
willow-mcp-compile = "willow_mcp.registry:compile_cli_main"
willow-mcp-sign-seed = "willow_mcp.seed_sign:main"
willow-mcp-compile-persona = "willow_mcp.persona_compile:main"
willow-mcp-integrations = "willow_mcp.integrations:main"

[project.urls]
Homepage = "https://github.com/willow-memory/willow-mcp"
Repository = "https://github.com/willow-memory/willow-mcp"
Issues = "https://github.com/willow-memory/willow-mcp/issues"
Changelog = "https://github.com/willow-memory/willow-mcp/blob/master/CHANGELOG.md"

[tool.willow.fleet]
# The packages this operator releases, and therefore the ones whose bump policy
# we know. docs/design/fleet-versioning.md Rule 1 caps a pre-1.0 one at its next
# minor, because below 1.0 our release configs ship breaking changes as minors.
#
# This list exists so `tests/test_fleet_versioning.py` has ONE place to read the
# roster from. It used to be a hardcoded set inside that test, which meant a
# fourth package could join with exactly the bug the test exists to prevent and
# the test would pass — and that shrinking the set to `{"jeles"}` silently
# disabled it. Adding a package here now forces both a correct pin and a row in
# the doc's Rule 2 table, which is where its public surface gets decided.
packages = ["willow-mcp", "jeles", "kartikeya", "nestor-meaning", "willows-grove", "forge-play"]

# Roster members this operator releases but this package does not consume.
# `packages` is the release roster — "the ones whose bump policy we know" — and
# until willows-grove joined, every member was also a dependency, so the pin
# rule could read the roster directly. It is not: the grove is the operator's
# seat, a consumer of willow-mcp rather than a producer for it, and adding a
# dependency here to satisfy a test would invert that.
#
# Rule 2 still applies to everything on the roster — a released package owes
# callers a defined surface whether or not this repo imports it. Only the pin
# rules skip these.
#
# Listed explicitly, not derived. "Skip anything absent from dependencies" would
# mean a dropped jeles pin silently stops being enforced, which is the exact
# failure the roster comment above was written to prevent.
unconsumed = ["willows-grove"]

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; off-tag builds get a `.devN+g<sha>` suffix that PyPI rejects, so an
# accidental publish from an untagged commit fails loudly instead of shipping
# something mislabelled. CI must check out with `fetch-depth: 0` — the default
# shallow checkout carries no tags and the derived version would be wrong.
#
# v2.0.0 and v2.0.1 are tagged, so derivation works today. The three v1.x
# releases on PyPI were never tagged; their version-bump commits are
#   v1.0.0 fecb0c0   v1.1.0 6ad4a4e   v1.2.0 61c49e2
# Tagging them is archaeology only — `skip-existing` in release.yml keeps the
# resulting workflow runs from failing on versions PyPI already holds.
source = "vcs"
# When no git tags are reachable (fresh clone, shallow checkout without tags),
# hatch-vcs falls back to this version instead of 0.0.0+unknown.  Keep it in
# sync with .release-please-manifest.json — release-please bumps both.
fallback-version = "2.13.1"

[tool.hatch.build.targets.wheel]
packages = ["src/willow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Assigned lambdas (`q = lambda s, *a: ...`) are deliberate compact helpers
# in this codebase; don't fight the style.
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# server.py interleaves imports with module init on purpose: later modules
# need _store/_receipt_log to exist at import time. Moving the imports up
# would break the boot order, so E402 is accepted there.
"src/willow_mcp/server.py" = ["E402"]
# The test suite deliberately uses compact one-line setup statements
# (`env("veep"); env("victim")`); don't fight the style.
"tests/*" = ["E702"]
